name: deploy

# CI on every push/PR; build + auto-deploy to the VPS only on push to master.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/nbeny

jobs:
  # ---------------------------------------------------------------- test
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ./libs/cmi_common
          pip install ./services/api-gateway
          pip install pytest pytest-asyncio
      - name: Read-plane parity + unit tests
        run: |
          python -m pytest \
            tests/test_read_contract.py \
            tests/test_api_gateway_read.py \
            tests/test_api_gateway_sentiment.py \
            tests/test_ai_config.py \
            tests/test_ai_quota.py \
            tests/test_scorer.py \
            tests/test_scorer_diagnostics.py \
            tests/test_sonnet_budget.py \
            tests/test_collector_runtime.py \
            tests/test_collector_social_main.py \
            tests/test_control_api_turnstile.py \
            tests/test_control_api_collectors.py \
            tests/test_derivatives_fundamentals_events.py \
            tests/test_shared_universe.py \
            tests/test_defillama_unlocks.py \
            tests/test_defillama_mapper.py \
            tests/test_defillama_client.py \
            tests/test_defillama_collector.py \
            tests/test_binance_futures_mapper.py \
            tests/test_binance_futures_client.py \
            tests/test_binance_futures_collector.py \
            tests/test_haiku_context_features.py \
            tests/test_scoring.py \
            tests/test_scoring_new_axes.py \
            tests/test_scoring_renormalisation.py \
            tests/test_decision_engine_context_features.py \
            tests/test_market_regime_signal.py  \
            tests/test_developer_event.py \
            tests/test_github_activity.py \
            tests/test_github_aggregate.py \
            tests/test_github_lists.py \
            tests/test_github_client.py \
            tests/test_github_models.py \
            tests/test_github_repo_map.py \
            tests/test_github_collector.py \
            tests/test_github_store.py \
            tests/test_github_registry.py \
            tests/test_haiku_developer_features.py \
            tests/test_scoring_developer_axis.py \
            tests/test_axis_parity.py  \
            tests/test_deployment_wiring.py \
            tests/test_risk_confidence_floor.py \
            tests/test_telegram_provider.py -q

  # -------------------------------------------------------------- images
  images:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: collector-coingecko,   dockerfile: docker/Dockerfile,     path: services/collector-coingecko }
          - { name: collector-dexscreener, dockerfile: docker/Dockerfile,     path: services/collector-dexscreener }
          - { name: collector-social,      dockerfile: docker/Dockerfile,     path: services/collector-social }
          - { name: collector-news,        dockerfile: docker/Dockerfile,     path: services/collector-news }
          - { name: collector-kraken,      dockerfile: docker/Dockerfile,     path: services/collector-kraken }
          - { name: collector-defillama,   dockerfile: docker/Dockerfile,     path: services/collector-defillama }
          - { name: collector-github,      dockerfile: docker/Dockerfile,     path: services/collector-github }
          - { name: collector-binance-futures, dockerfile: docker/Dockerfile, path: services/collector-binance-futures }
          - { name: decision-engine,       dockerfile: docker/Dockerfile,     path: services/decision-engine }
          - { name: risk-engine,           dockerfile: docker/Dockerfile,     path: services/risk-engine }
          - { name: trading-engine,        dockerfile: docker/Dockerfile,     path: services/trading-engine }
          - { name: api-gateway,           dockerfile: docker/Dockerfile,     path: services/api-gateway }
          - { name: control-api,           dockerfile: docker/Dockerfile,     path: services/control-api }
          - { name: websocket-gateway,     dockerfile: docker/Dockerfile,     path: services/websocket-gateway }
          - { name: migrate,               dockerfile: docker/Dockerfile,     path: migrations }
          - { name: sentiment-service,     dockerfile: docker/Dockerfile.ml,  path: services/sentiment-service }
          - { name: ai-worker-haiku,       dockerfile: docker/Dockerfile.ai,  path: services/ai-worker-haiku }
          - { name: ai-worker-sonnet,      dockerfile: docker/Dockerfile.ai,  path: services/ai-worker-sonnet }
          - { name: web-terminal,          dockerfile: frontend/Dockerfile,   path: "",                          context: frontend, web: true }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/bottrading-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/bottrading-${{ matrix.name }}:${{ github.sha }}
          build-args: |
            SERVICE_PATH=${{ matrix.path }}
            NEXT_PUBLIC_USE_MOCK=0
            NEXT_PUBLIC_WS_URL=wss://crypto.nbeny.fr/ws
            NEXT_PUBLIC_API_BASE=/api/gateway
            NEXT_PUBLIC_CONTROL_BASE=/api/control
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAACjfuvOheFbJ2_Fs
            API_GATEWAY_URL=http://api-gateway:8000
            CONTROL_API_URL=http://control-api:8000
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # -------------------------------------------------------------- deploy
  deploy:
    needs: images
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Le .env du VPS etait pose a la main : des secrets stockes dans GitHub y
      # restaient inertes. Il est desormais regenere a chaque deploiement depuis
      # l'environment `production`. Le rendu passe par Python et os.environ, pas
      # par une interpolation ${{ }} dans du shell : un guillemet ou un dollar
      # dans une valeur y casserait le fichier ou s'echapperait dans les logs.
      - name: Render VPS .env from the production environment
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CONTROL_ADMIN_USER: ${{ secrets.CONTROL_ADMIN_USER }}
          CONTROL_ADMIN_PASSWORD: ${{ secrets.CONTROL_ADMIN_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GH_COLLECTOR_TOKEN: ${{ secrets.GH_COLLECTOR_TOKEN }}
          KRAKEN_READ_API_KEY: ${{ secrets.KRAKEN_READ_API_KEY }}
          KRAKEN_READ_API_SECRET: ${{ secrets.KRAKEN_READ_API_SECRET }}
          CMI_ACCOUNT_POLL_S: ${{ vars.CMI_ACCOUNT_POLL_S }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          DB_USER: ${{ vars.DB_USER }}
          DB_NAME: ${{ vars.DB_NAME }}
          KAFKA_HEAP_OPTS: ${{ vars.KAFKA_HEAP_OPTS }}
          HAIKU_REPLICAS: ${{ vars.HAIKU_REPLICAS }}
          ANTHROPIC_CLI_CONCURRENCY: ${{ vars.ANTHROPIC_CLI_CONCURRENCY }}
          OTEL_TRACING_ENABLED: ${{ vars.OTEL_TRACING_ENABLED }}
          TRADING_MODE: ${{ vars.TRADING_MODE }}
          GH_COLLECTOR_POLL_INTERVAL: ${{ vars.GH_COLLECTOR_POLL_INTERVAL }}
          GH_COLLECTOR_MAX_REFRESH_PER_CYCLE: ${{ vars.GH_COLLECTOR_MAX_REFRESH_PER_CYCLE }}
          GH_COLLECTOR_UNIVERSE_SIZE: ${{ vars.GH_COLLECTOR_UNIVERSE_SIZE }}
          GH_COLLECTOR_LISTS_REFRESH_HOURS: ${{ vars.GH_COLLECTOR_LISTS_REFRESH_HOURS }}
          REGISTRY: ${{ env.REGISTRY }}
          TAG: ${{ github.sha }}
        run: |
          umask 077
          python3 scripts/render_vps_env.py .env.render

      - name: Back up and install the .env on the VPS
        run: |
          set -euo pipefail
          HOST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          # Le .env courant du VPS a pu recevoir une cle a la main. On le garde,
          # et on affiche le diff des NOMS de cles -- jamais des valeurs.
          ssh "$HOST" 'set -e; cd /opt/bottrading
            if [ -f .env ]; then
              cp -p .env ".env.bak.${{ github.sha }}"
              grep -oE "^[A-Za-z_][A-Za-z0-9_]*" .env | sort -u > /tmp/keys.old
            else
              : > /tmp/keys.old
            fi'
          scp .env.render "$HOST:/opt/bottrading/.env.new"
          # Echec ferme : une cle presente sur la machine et absente du rendu
          # est une configuration posee a la main que GitHub ignore. La laisser
          # disparaitre desactive une source en silence -- c'est arrive des le
          # premier rendu, qui a emporte la paire Kraken en lecture seule. On
          # refuse d'ecraser, on garde le .env en place, et on nomme les cles.
          ssh "$HOST" 'set -e; cd /opt/bottrading
            grep -oE "^[A-Za-z_][A-Za-z0-9_]*" .env.new | sort -u > /tmp/keys.new
            lost=$(comm -23 /tmp/keys.old /tmp/keys.new)
            echo "== cles ajoutees par ce deploiement =="
            comm -13 /tmp/keys.old /tmp/keys.new || true
            if [ -n "$lost" ]; then
              echo "FATAL: le rendu perdrait des cles presentes sur le VPS :" >&2
              echo "$lost" >&2
              echo "Les ajouter dans environment production ET dans scripts/render_vps_env.py." >&2
              rm -f .env.new /tmp/keys.old /tmp/keys.new
              exit 1
            fi
            mv .env.new .env
            chmod 600 .env
            rm -f /tmp/keys.old /tmp/keys.new'
          rm -f .env.render

      - name: Sync deploy files to VPS
        run: |
          rsync -az --mkpath \
            docker-compose.vps.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/bottrading/"
          rsync -az --delete \
            scripts/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/bottrading/scripts/"
          rsync -az --delete \
            observability/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/bottrading/observability/"
      - name: Deploy on VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "REGISTRY=${{ env.REGISTRY }} TAG=${{ github.sha }} \
             GHCR_USER=${{ github.actor }} GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }} \
             bash /opt/bottrading/scripts/deploy-vps.sh"
