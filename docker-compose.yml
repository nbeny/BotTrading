# Crypto Market Intelligence — full stack orchestration.
# Build context is the repo root for every service so the shared library
# (libs/cmi_common) is available to the shared docker/Dockerfile.

x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DB_HOST: postgres
  DB_USER: ${DB_USER:-cmi}
  DB_PASSWORD: ${DB_PASSWORD:-cmi}
  DB_NAME: ${DB_NAME:-cmi}
  REDIS_HOST: redis
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_SENTRY_DSN: ${SENTRY_DSN:-}
  OTEL_ENVIRONMENT: ${ENVIRONMENT:-development}

x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - cmi

services:
  # ----------------------------------------------------------------- edge
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --api.dashboard=true
      - --metrics.prometheus=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/letsencrypt
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.cmi.localhost`)
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls=true
    networks:
      - cmi

  # ------------------------------------------------------------ event bus
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - cmi

  kafka-init:
    image: bitnami/kafka:3.7
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/create-topics.sh"]
    volumes:
      - ./scripts/create-topics.sh:/init/create-topics.sh:ro
    networks:
      - cmi

  # ------------------------------------------------------------- storage
  postgres:
    image: timescale/timescaledb:2.15.3-pg16
    environment:
      POSTGRES_USER: ${DB_USER:-cmi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cmi}
      POSTGRES_DB: ${DB_NAME:-cmi}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cmi}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cmi

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cmi

  # --------------------------------------------------------- migrations
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_PATH: migrations
        APP_MODULE: unused
    command: ["sh", "-c", "alembic upgrade head"]
    environment: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - cmi

  # --------------------------------------------------------- collectors
  collector-coingecko:
    <<: *service-defaults
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE_PATH: services/collector-coingecko } }
    environment:
      <<: *common-env
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      COINGECKO_POLL_INTERVAL: ${COINGECKO_POLL_INTERVAL:-60}
    labels:
      - traefik.enable=true
      - traefik.http.routers.coingecko.rule=Host(`coingecko.cmi.localhost`)
      - traefik.http.routers.coingecko.entrypoints=websecure
      - traefik.http.routers.coingecko.tls=true
      - traefik.http.services.coingecko.loadbalancer.server.port=8000

  collector-dexscreener:
    <<: *service-defaults
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE_PATH: services/collector-dexscreener } }
    environment:
      <<: *common-env
      DEXSCREENER_POLL_INTERVAL: ${DEXSCREENER_POLL_INTERVAL:-30}
    labels:
      - traefik.enable=true
      - traefik.http.routers.dexscreener.rule=Host(`dexscreener.cmi.localhost`)
      - traefik.http.routers.dexscreener.entrypoints=websecure
      - traefik.http.routers.dexscreener.tls=true
      - traefik.http.services.dexscreener.loadbalancer.server.port=8000

  collector-social:
    <<: *service-defaults
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE_PATH: services/collector-social } }
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      SOCIAL_POLL_INTERVAL: ${SOCIAL_POLL_INTERVAL:-300}
      BLUESKY_QUERY: ${BLUESKY_QUERY:-crypto}
      REDDIT_SUBREDDITS: ${REDDIT_SUBREDDITS:-CryptoCurrency,CryptoMoonShots,solana}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      MASTODON_INSTANCE: ${MASTODON_INSTANCE:-mastodon.social}
      MASTODON_HASHTAG: ${MASTODON_HASHTAG:-crypto}
      NEYNAR_API_KEY: ${NEYNAR_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      LENS_QUERY: ${LENS_QUERY:-crypto}
      # Telegram: all three required, or the source stays off. TELEGRAM_SESSION
      # is minted by scripts/telegram_session.py (see .env.example).
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION: ${TELEGRAM_SESSION:-}
      TELEGRAM_CHANNELS: ${TELEGRAM_CHANNELS:-}
      SOURCE_BREAKER_COOLDOWN: ${SOURCE_BREAKER_COOLDOWN:-300}
    labels:
      - traefik.enable=true
      - traefik.http.routers.social.rule=Host(`social.cmi.localhost`)
      - traefik.http.routers.social.entrypoints=websecure
      - traefik.http.routers.social.tls=true
      - traefik.http.services.social.loadbalancer.server.port=8000

  collector-news:
    <<: *service-defaults
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE_PATH: services/collector-news } }
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      NEWS_POLL_INTERVAL: ${NEWS_POLL_INTERVAL:-300}
      CRYPTOCOMPARE_API_KEY: ${CRYPTOCOMPARE_API_KEY:-}
      RSS_FEEDS: ${RSS_FEEDS:-}
      GDELT_QUERY: ${GDELT_QUERY:-cryptocurrency}
      NEWSDATA_API_KEY: ${NEWSDATA_API_KEY:-}
      SOURCE_BREAKER_COOLDOWN: ${SOURCE_BREAKER_COOLDOWN:-300}
    labels:
      - traefik.enable=true
      - traefik.http.routers.news.rule=Host(`news.cmi.localhost`)
      - traefik.http.routers.news.entrypoints=websecure
      - traefik.http.routers.news.tls=true
      - traefik.http.services.news.loadbalancer.server.port=8000

  collector-kraken:
    <<: *service-defaults
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE_PATH: services/collector-kraken } }
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      KRAKEN_BROAD_CADENCE: ${KRAKEN_BROAD_CADENCE:-900}
      KRAKEN_MAJORS_CADENCE: ${KRAKEN_MAJORS_CADENCE:-300}
      KRAKEN_MAJOR_MIN_MENTIONS_7D: ${KRAKEN_MAJOR_MIN_MENTIONS_7D:-10}
    labels:
      - traefik.enable=true
      - traefik.http.routers.krakencol.rule=Host(`kraken.cmi.localhost`)
      - traefik.http.routers.krakencol.entrypoints=websecure
      - traefik.http.routers.krakencol.tls=true
      - traefik.http.services.krakencol.loadbalancer.server.port=8000

  collector-defillama:
    <<: *service-defaults
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE_PATH: services/collector-defillama } }
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *common-env
      DEFILLAMA_POLL_INTERVAL: ${DEFILLAMA_POLL_INTERVAL:-600}
      DEFILLAMA_MAX_UNLOCK_FETCHES: ${DEFILLAMA_MAX_UNLOCK_FETCHES:-3}

  collector-github:
    <<: *service-defaults
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE_PATH: services/collector-github } }
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *common-env
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_POLL_INTERVAL: ${GITHUB_POLL_INTERVAL:-600}
      GITHUB_MAX_REFRESH_PER_CYCLE: ${GITHUB_MAX_REFRESH_PER_CYCLE:-7}
      GITHUB_UNIVERSE_SIZE: ${GITHUB_UNIVERSE_SIZE:-250}
      GITHUB_LISTS_REFRESH_HOURS: ${GITHUB_LISTS_REFRESH_HOURS:-168}

  collector-binance-futures:
    <<: *service-defaults
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE_PATH: services/collector-binance-futures } }
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *common-env
      BINANCE_FUTURES_POLL_INTERVAL: ${BINANCE_FUTURES_POLL_INTERVAL:-300}
      KRAKEN_MAJOR_MIN_MENTIONS_7D: ${KRAKEN_MAJOR_MIN_MENTIONS_7D:-10}

  # ----------------------------------------------------------- analytics
  sentiment-service:
    <<: *service-defaults
    build: { context: ., dockerfile: docker/Dockerfile.ml, args: { SERVICE_PATH: services/sentiment-service } }
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      SENTIMENT_MODEL: ${SENTIMENT_MODEL:-ElKulako/cryptobert}
      SENTIMENT_WORKER_INTERVAL: ${SENTIMENT_WORKER_INTERVAL:-10}
      SENTIMENT_BATCH: ${SENTIMENT_BATCH:-100}
    volumes:
      # Persist downloaded model weights (HF_HOME) across restarts.
      - hf-cache:/home/appuser/.cache/huggingface

  ai-worker-haiku:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
      args:
        SERVICE_PATH: services/ai-worker-haiku
    environment:
      <<: *common-env
      ANTHROPIC_HAIKU_MODEL: ${ANTHROPIC_HAIKU_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_TRANSPORT: ${ANTHROPIC_TRANSPORT:-cli}
      ANTHROPIC_CLI_PATH: ${ANTHROPIC_CLI_PATH:-claude}
      ANTHROPIC_CLI_TIMEOUT_MS: ${ANTHROPIC_CLI_TIMEOUT_MS:-120000}
      ANTHROPIC_CLI_CONCURRENCY: ${ANTHROPIC_CLI_CONCURRENCY:-4}
    volumes:
      - ${CLAUDE_DIR}:/home/appuser/.claude:ro
      - ${CLAUDE_CONFIG}:/home/appuser/.claude.json:ro
    deploy:
      replicas: ${HAIKU_REPLICAS:-2}

  ai-worker-sonnet:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
      args:
        SERVICE_PATH: services/ai-worker-sonnet
    environment:
      <<: *common-env
      ANTHROPIC_SONNET_MODEL: ${ANTHROPIC_SONNET_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_TRANSPORT: ${ANTHROPIC_TRANSPORT:-cli}
      ANTHROPIC_CLI_PATH: ${ANTHROPIC_CLI_PATH:-claude}
      ANTHROPIC_CLI_TIMEOUT_MS: ${ANTHROPIC_CLI_TIMEOUT_MS:-120000}
      ANTHROPIC_CLI_CONCURRENCY: ${ANTHROPIC_CLI_CONCURRENCY:-4}
      # Rolling-hour ceiling on senior-analyst calls. Measured in production:
      # 329 escalations/24h against a 288/day budget, so this is the binding
      # constraint on decision output. Raise deliberately — it spends quota.
      ANTHROPIC_MAX_CALLS_PER_HOUR: ${ANTHROPIC_MAX_CALLS_PER_HOUR:-12}
      ANTHROPIC_SYMBOL_COOLDOWN_S: ${ANTHROPIC_SYMBOL_COOLDOWN_S:-900}
    volumes:
      - ${CLAUDE_DIR}:/home/appuser/.claude:ro
      - ${CLAUDE_CONFIG}:/home/appuser/.claude.json:ro

  decision-engine:
    <<: *service-defaults
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE_PATH: services/decision-engine } }
    environment:
      <<: *common-env
      DECISION_THRESHOLD: ${DECISION_THRESHOLD:-70}

  risk-engine:
    <<: *service-defaults
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE_PATH: services/risk-engine } }
    environment:
      <<: *common-env
      # Kept in step with docker-compose.vps.yml. Without these the dev
      # stack runs the pre-v2 confidence floor, i.e. the exact bug the VPS
      # config was changed to fix, and local reproduction of production is
      # impossible by construction.
      RISK_MIN_SCORE: ${RISK_MIN_SCORE:-70}
      RISK_MIN_CONFIDENCE: ${RISK_MIN_CONFIDENCE:-0.41}
      RISK_MAX_POSITION_PCT: ${RISK_MAX_POSITION_PCT:-0.05}

  trading-engine:
    <<: *service-defaults
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE_PATH: services/trading-engine } }
    environment:
      <<: *common-env
      TRADING_MODE: dry_run
      TRADING_ENABLED: "true"
      MAX_ORDER_USD: ${MAX_ORDER_USD:-500}
      MAX_LEVERAGE: ${MAX_LEVERAGE:-3}
      MAX_ORDERS_PER_HOUR: ${MAX_ORDERS_PER_HOUR:-10}
      ENTRY_TIMEOUT_S: ${ENTRY_TIMEOUT_S:-30}
      RECONCILE_INTERVAL_S: ${RECONCILE_INTERVAL_S:-10}
      KRAKEN_API_KEY: ${KRAKEN_API_KEY:-}
      KRAKEN_API_SECRET: ${KRAKEN_API_SECRET:-}

  api-gateway:
    <<: *service-defaults
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE_PATH: services/api-gateway } }
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment: *common-env
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.cmi.localhost`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.services.api.loadbalancer.server.port=8000

  control-api:
    <<: *service-defaults
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE_PATH: services/control-api } }
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      JWT_SECRET: ${JWT_SECRET:-}
      CONTROL_ADMIN_USER: ${CONTROL_ADMIN_USER:-admin}
      CONTROL_ADMIN_PASSWORD: ${CONTROL_ADMIN_PASSWORD:-admin}
      # Cloudflare Turnstile: unset locally -> /auth/login skips the captcha.
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    # Direct host port so the Next.js terminal (or `npm run dev`) can reach the
    # control plane at http://localhost:8001 without going through Traefik/TLS.
    ports:
      - "8001:8000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.control.rule=Host(`control.cmi.localhost`)
      - traefik.http.routers.control.entrypoints=websecure
      - traefik.http.routers.control.tls=true
      - traefik.http.services.control.loadbalancer.server.port=8000

  websocket-gateway:
    <<: *service-defaults
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE_PATH: services/websocket-gateway } }
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
      JWT_SECRET: ${JWT_SECRET:-}
    # Direct host port so the Next.js terminal can reach ws://localhost:8080/ws
    # without going through Traefik/TLS during local development.
    ports:
      - "8080:8000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.ws.rule=Host(`ws.cmi.localhost`)
      - traefik.http.routers.ws.entrypoints=websecure
      - traefik.http.routers.ws.tls=true
      - traefik.http.services.ws.loadbalancer.server.port=8000

  # -------------------------------------------------------- web terminal (frontend)
  web-terminal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Default to standalone demo (mock) mode so the terminal is fully
        # functional out of the box. Set NEXT_PUBLIC_USE_MOCK=0 (and add the
        # backend portfolio/trading/risk/auth endpoints) for live mode.
        NEXT_PUBLIC_USE_MOCK: ${WEB_USE_MOCK:-1}
        NEXT_PUBLIC_WS_URL: ${WEB_WS_URL:-wss://ws.cmi.localhost/ws}
        NEXT_PUBLIC_API_BASE: /api/gateway
        NEXT_PUBLIC_CONTROL_BASE: /api/control
        # Site key (public half). Set it together with TURNSTILE_SECRET_KEY
        # above — one without the other either locks login out or leaves it
        # unguarded. Keep both empty for local work.
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    environment:
      # Server-side rewrite target for /api/gateway/* -> FastAPI api-gateway.
      API_GATEWAY_URL: http://api-gateway:8000
      # Server-side rewrite target for /api/control/* -> FastAPI control-api.
      CONTROL_API_URL: http://control-api:8000
      NODE_ENV: production
    depends_on:
      - api-gateway
      - control-api
      - websocket-gateway
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`app.cmi.localhost`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls=true
      - traefik.http.services.web.loadbalancer.server.port=3000
    networks:
      - cmi

  # -------------------------------------------------------- observability
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=Host(`prometheus.cmi.localhost`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.tls=true
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
    networks:
      - cmi

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.cmi.localhost`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    networks:
      - cmi

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    networks:
      - cmi

networks:
  cmi:
    driver: bridge

volumes:
  kafka-data:
  pg-data:
  redis-data:
  prom-data:
  grafana-data:
  traefik-acme:
  hf-cache:
