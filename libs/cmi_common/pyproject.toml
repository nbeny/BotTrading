[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmi-common"
version = "0.1.0"
description = "Shared library for the Crypto Market Intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiokafka>=0.11",
    # aiokafka's producer is configured with compression_type="lz4"
    # (kafka/producer.py) which needs the lz4 codec installed.
    "lz4>=4.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "sentry-sdk>=2.5",
]

[tool.hatch.build.targets.wheel]
packages = ["cmi_common"]
