[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "collector-social"
version = "0.1.0"
description = "Fan-out social collector — Bluesky + Reddit adaptive poll loops -> raw_content"
requires-python = ">=3.12"
dependencies = ["cmi-common", "httpx>=0.27", "sqlalchemy>=2.0", "asyncpg>=0.29"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
