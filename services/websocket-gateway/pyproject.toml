[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "websocket-gateway"
version = "0.1.0"
description = "Bridges Kafka events to browser WebSocket clients (operator terminal)"
requires-python = ">=3.12"
dependencies = ["cmi-common"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
